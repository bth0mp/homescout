name: Build image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is minted per-run by Actions. No secret to manage.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build does not mean the thing boots. This proves the standalone
      # server starts, finds its migrations, creates the schema on an empty
      # volume, serves static assets, and honours APP_PASSWORD.
      - name: Smoke test the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e APP_PASSWORD=ci-secret \
            -e DATABASE_PATH=/data/homescout.db \
            -p 3000:3000 "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then
              echo "::error::container never became healthy"
              docker logs smoke
              exit 1
            fi
            sleep 2
          done

          echo "--- health (must be public, db up) ---"
          health=$(curl -fsS http://127.0.0.1:3000/api/health)
          echo "$health"
          echo "$health" | grep -q '"db":"up"'

          echo "--- schema actually migrated on an empty volume ---"
          docker exec smoke node -e "
            const D=require('better-sqlite3');
            const t=new D('/data/homescout.db').prepare(
              \"select name from sqlite_master where type='table' order by name\"
            ).all().map(r=>r.name);
            console.log(t.join(','));
            for (const need of ['properties','scenarios','share_links','geocode_cache','crime_cache'])
              if (!t.includes(need)) { console.error('missing table: '+need); process.exit(1); }
          "

          echo "--- auth gate ---"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u any:ci-secret http://127.0.0.1:3000/)" = 200 ]

          echo "--- every page actually renders ---"
          # A health check only proves the process is alive. This deploy shipped
          # a page that 500'd while /api/health stayed green, so assert the real
          # routes render too.
          for path in / /map /compare /shares /property/new; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u any:ci-secret "http://127.0.0.1:3000$path")
            echo "  $path -> $code"
            if [ "$code" != 200 ]; then
              echo "::error::$path returned $code"
              docker logs smoke
              exit 1
            fi
          done

          echo "--- static assets served (hydration depends on this) ---"
          css=$(curl -s -u any:ci-secret http://127.0.0.1:3000/ \
                | grep -o '/_next/static/[^"]*\.css' | head -1)
          test -n "$css"
          curl -fsS -o /dev/null -u any:ci-secret "http://127.0.0.1:3000$css"
          echo "ok: $css"

          docker rm -f smoke >/dev/null
